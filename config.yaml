# ============================================================
# QuantLab 配置文件
# ============================================================

# --- 市场参数 ---
market:
  stamp_tax_rate: 0.0005      # 印花税 0.05%（仅卖出，2023年8月起）
  commission_rate: 0.0003     # 佣金 0.03%（万三）
  min_commission: 5.0         # 最低佣金（元）
  slippage_rate: 0.001        # 滑点 0.1%
  lot_size: 100               # 一手 = 100 股
  t_plus_1: true              # T+1 交收

# --- 股票池 ---
universe:
  indices: ["000852"]         # 指数代码：000852=中证1000, 932000=中证2000, 000905=中证500, 000300=沪深300
  exclude_st: true            # 剔除 ST
  min_listed_days: 60         # 剔除上市不足60天的新股（次新股波动大）

# --- 因子 ---
factors:
  technical:
    momentum_periods: [5, 10, 20, 60, 120]
    volatility_periods: [10, 20, 60]
    volume_ratio_periods: [5, 20]
    rsi_period: 14
  fundamental:
    use_spot_data: false      # 实时快照平铺到历史日期=未来函数，默认关闭（回测会高估收益）
    use_financial_data: false # 从财报获取 ROE 等（较慢）
  processing:
    winsorize_limits: [0.01, 0.99]
    normalize_method: "zscore"  # zscore / rank
    neutralize: false           # Barra 风格中性化（需要行业分类）

# --- 模型 ---
model:
  type: "regressor"           # regressor（收益率回归）/ classifier（涨跌分类）
  horizon: 20                 # 预测未来 N 日收益
  params:
    objective: "regression"
    metric: "rmse"
    num_leaves: 31
    learning_rate: 0.05
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 5
    min_data_in_leaf: 100
    lambda_l1: 0.1
    lambda_l2: 1.0
    verbose: -1
  tuning:
    enabled: false
    n_trials: 50
  walk_forward:
    min_train_months: 24      # 首个预测窗口前的最短训练期（月）
    retrain_months: 6         # 每 N 个月滚动重训一次

# --- 回测 ---
backtest:
  initial_capital: 1000000    # 初始资金 100万
  rebalance_frequency: "monthly"  # daily / weekly / monthly
                                # 启用 position_policy 后这是**策略评估频率**
  max_positions: 50           # 最大持仓数(策略模式下由 max_names 接管,此项不生效)
  position_sizing: "equal_weight"  # equal_weight / inverse_volatility / signal_strength
  benchmark: "000852"         # 基准指数

# --- 分数带位仓位管理（关闭时=沿用 Top-K 等权，已有回测数字不变）---
# 建仓线以上才建仓、清仓线以下必清仓；每笔基准 5%、建仓最高 8%、补仓后单票
# 最高 16%；补/减由"分数相对建仓时的步长 Δ"触发；减仓成交价之上的补仓被禁止。
# ⚠ buy_score/sell_score 的量纲取决于 model.type:
#    regressor → 预测 20 日收益率(0.02 = +2%),下面的默认值按此校准;
#    classifier → 上涨概率(0~1),阈值必须重设(如 0.55/0.50),否则恒不建仓或恒建仓。
#    改动任何带位参数后需重新跑回测(walk-forward 预测本身不变,不必重训)。
position_policy:
  enabled: false              # false = 沿用 Top-K 等权(已有回测数字不变)
  buy_score: 0.02             # 建仓线:低于它不建仓
  sell_score: 0.0             # 清仓线:低于它无条件清仓(不补、不锁价格)
  strong_score: 0.05          # 分数高到这儿就给满 max_entry_weight 仓
  step_score_floor: 0.005     # 一档的最小分数步长(防"建仓即触发补仓")
  step_multiplier: 1.0        # Δ = multiplier × (建仓分数 − 建仓线)
  base_weight: 0.05           # 建仓基准仓位(占总资产)
  max_entry_weight: 0.08      # 分数很高时的建仓上限
  max_position_weight: 0.16   # 补仓后的单票上限
  min_hold_weight: 0.025      # 减仓后的最低仓位,低于它改为清仓(不留碎仓)
  add_step_weight: 0.05       # 补一档加的仓位
  trim_step_weight: 0.05      # 减一档降的仓位
  max_steps_per_eval: 2       # 一次评估最多补/减几档(防单日跳档)
  min_trade_value: 10000      # 单笔补/减的最小名义额(清仓不受限)
  max_names: 12               # 同时在市股票数上限
  add_reserve_weight: 0.05    # 给后续补仓留的额度,新仓不许吃光
  trim_price_ttl_days: 60     # "减仓价之上禁止补仓"的有效期(自然日)

# --- 实盘/每日批处理 ---
live:
  broker: "simulate"          # simulate（模拟撮合）/ qmt（真实柜台）/ none（仅输出指令文件）
  order_dir: "live/output"    # 调仓指令文件输出目录
  state_dir: "live/state"     # 持仓状态持久化目录
  lookback_days: 250          # 信号计算回看交易日数
  qmt:
    mini_qmt_path: ""         # miniQMT 用户数据目录，如 D:\国金QMT\userdata_mini
    account_id: ""            # 资金账号

# --- 数据下载 ---
download:
  max_workers: 8              # 并发线程数（网络型任务，8~16 足够）
  requests_per_second: 20     # 全局请求速率上限（腾讯/东财共用一个令牌桶）
  timeout: 20                 # 单次 HTTP 超时（秒）

# --- 缓存 ---
cache:
  directory: "data/cache"
  max_age_daily: 1            # 日线缓存有效期（天）
  max_age_fundamentals: 90    # 基本面缓存有效期（天）

# --- 日志 ---
logging:
  level: "INFO"
  file: "logs/quantlab.log"
  rotation: "10 MB"
  retention: "30 days"
